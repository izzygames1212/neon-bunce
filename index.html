<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuff Game Hub</title>
  <style>
    /* Base Styling */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Loading Screen */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0a0a0c;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #333;
      border-top: 5px solid #ff0055;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-top: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* HUD / UI Header */
    #game-ui {
      width: 100%;
      padding: 20px;
      background: #1a1a1d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .nav-btn, .action-btn {
      background: #ff0055;
      color: white;
      border: none;
      padding: 10px 20px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 5px;
      transition: 0.2s;
    }

    .nav-btn:hover, .action-btn:hover {
      background: #ff3377;
    }

    /* Modals (Settings & Shop) */
    .modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      max-width: 800px;
      max-height: 80vh;
      background: #1a1a24;
      border: 2px solid #ff0055;
      border-radius: 10px;
      padding: 20px;
      overflow-y: auto;
      z-index: 10;
    }

    .hidden {
      display: none;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }

    /* Shop Layout */
    .shop-section-title {
      color: #ff0055;
      margin: 15px 0 10px 0;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .shop-card {
      background: #252533;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .shop-card.bundle {
      border: 2px solid #ffd700;
    }

    .shop-card h4 {
      margin-bottom: 10px;
    }

    .shop-card p {
      color: #aaa;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div id="loading-screen">
    <h1 style="color: #ff0055; font-size: 2.5rem;">LOADING TUFF GAME...</h1>
    <div class="spinner"></div>
    <button id="start-btn" class="action-btn" style="display:none; margin-top:20px;" onclick="enterGame()">PRESS TO START</button>
  </div>

  <audio id="bg-music" loop>
    <source src="assets/tuff_track.mp3" type="audio/mpeg">
  </audio>

  <div id="game-ui">
    <div>
      <button class="nav-btn" onclick="toggleModal('settings-modal')">Settings</button>
      <button class="nav-btn" onclick="toggleModal('shop-modal')">Item Shop</button>
    </div>
    <h2>Coins: <span id="coin-count" style="color: #ffd700;">5000</span></h2>
  </div>

  <div style="margin-top: 100px; text-align: center;">
    <h1>Game Active</h1>
    <p>Use the HUD buttons to open Settings or the Item Shop.</p>
  </div>

  <div id="settings-modal" class="modal hidden">
    <div class="modal-header">
      <h2>Settings</h2>
      <button class="action-btn" onclick="toggleModal('settings-modal')">X</button>
    </div>
    <div style="margin: 20px 0;">
      <label for="volume-slider">Music Volume: </label>
      <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.5" oninput="setVolume(this.value)">
    </div>
  </div>

  <div id="shop-modal" class="modal hidden">
    <div class="modal-header">
      <h2>Item Shop</h2>
      <button class="action-btn" onclick="toggleModal('shop-modal')">X</button>
    </div>
    
    <h3 class="shop-section-title">Bundles (5 Exclusive Packs)</h3>
    <div id="bundles-container" class="shop-grid"></div>

    <h3 class="shop-section-title">Skins</h3>
    <div id="skins-container" class="shop-grid"></div>
  </div>

  <script>
    // Data Structures
    const bundles = [
      { id: 'b1', name: 'Cyberware Pack', price: 1500 },
      { id: 'b2', name: 'Shadow Ninja Set', price: 2000 },
      { id: 'b3', name: 'Neon Overlord Bundle', price: 2500 },
      { id: 'b4', name: 'Wasteland Raider Kit', price: 1800 },
      { id: 'b5', name: 'Galactic Empire Pack', price: 3000 }
    ];

    const skins = [
      { id: 's1', name: 'Tuff Renegade', price: 500 },
      { id: 's2', name: 'Phantom Striker', price: 600 },
      { id: 's3', name: 'Vortex Assassin', price: 750 },
      { id: 's4', name: 'Crimson Spectre', price: 800 },
      { id: 's5', name: 'Mecha Titan', price: 1000 },
      { id: 's6', name: 'Solar Sentinel', price: 500 },
      { id: 's7', name: 'Void Walker', price: 850 },
      { id: 's8', name: 'Glitch Marauder', price: 900 },
      { id: 's9', name: 'Cyber Samurai', price: 1100 },
      { id: 's10', name: 'Frost Vanguard', price: 650 }
    ];

    const audio = document.getElementById('bg-music');

    // Display Start button when page assets complete loading
    window.addEventListener('load', () => {
      document.querySelector('.spinner').style.display = 'none';
      document.getElementById('start-btn').style.display = 'block';
    });

    // Start background music & reveal UI
    function enterGame() {
      document.getElementById('loading-screen').style.display = 'none';
      audio.volume = 0.5;
      audio.play().catch(err => console.log("Audio play blocked by browser:", err));
      renderShop();
    }

    // Audio Control
    function setVolume(val) {
      audio.volume = val;
    }

    // UI Controls
    function toggleModal(id) {
      document.getElementById(id).classList.toggle('hidden');
    }

    // Render Shop Data dynamically
    function renderShop() {
      const bContainer = document.getElementById('bundles-container');
      const sContainer = document.getElementById('skins-container');
      
      bContainer.innerHTML = bundles.map(b => `
        <div class="shop-card bundle">
          <h4>${b.name}</h4>
          <p>${b.price} Coins</p>
          <button class="action-btn" onclick="buyItem('${b.name}', ${b.price})">Buy</button>
        </div>
      `).join('');

      sContainer.innerHTML = skins.map(s => `
        <div class="shop-card">
          <h4>${s.name}</h4>
          <p>${s.price} Coins</p>
          <button class="action-btn" onclick="buyItem('${s.name}', ${s.price})">Buy</button>
        </div>
      `).join('');
    }

    // Purchase Logic
    function buyItem(name, price) {
      let coins = parseInt(document.getElementById('coin-count').innerText);
      if (coins >= price) {
        coins -= price;
        document.getElementById('coin-count').innerText = coins;
        alert(`Successfully purchased ${name}!`);
      } else {
        alert("Not enough coins!");
      }
    }
  </script>
</body>
</html>
