 <script>
        document.addEventListener("DOMContentLoaded", () => {
            const canvas = document.getElementById("gameCanvas");
            const ctx = canvas.getContext("2d");

            const titleScreen = document.getElementById("title-screen");
            const shopScreen = document.getElementById("shop-screen");
            const pvpScreen = document.getElementById("pvp-screen");
            const settingsScreen = document.getElementById("settings-screen");
            const loadingScreen = document.getElementById("loading-screen");
            const pauseScreen = document.getElementById("pause-screen");
            const gameOverScreen = document.getElementById("game-over-screen");
            const ui = document.getElementById("ui");

            const scoreUI = document.getElementById("score-ui");
            const coinsUI = document.getElementById("coins-ui");
            const menuCoins = document.getElementById("menu-coins");
            const shopCoins = document.getElementById("shop-coins");
            const modeUI = document.getElementById("mode-ui");
            const lobbyStatus = document.getElementById("lobby-status");
            const lobbyListContainer = document.getElementById("lobby-list-container");
            const loadingBar = document.getElementById("loading-bar");
            const loadingText = document.getElementById("loading-text");
            const shopGrid = document.getElementById("shop-grid");

            // Game State, Health & Economy
            let coins = 100;
            let playerHp = 3;
            let maxHp = 3;
            let settings = { sfx: true, music: true, shake: true };

            let gameRunning = false;
            let isPaused = false;
            let currentMode = "CLASSIC";
            let isHost = false;
            let score = 0;
            let lastTime = 0;
            let survivalTimer = 0;
            let screenShake = 0;

            let peer = null;
            let conn = null;

            // Audio Engine
            let audioCtx = null;
            let musicInterval = null;

            function initAudio() {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            function playSynthSound(freq, duration, type = "sine") {
                if (!audioCtx || !settings.sfx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            }

            function startBackgroundMusic() {
                initAudio();
                if (musicInterval) clearInterval(musicInterval);
                if (!settings.music) return;

                const notes = [220, 247, 261, 293, 329, 349, 392, 440];
                let step = 0;
                musicInterval = setInterval(() => {
                    if (gameRunning && !isPaused) {
                        playSynthSound(notes[step % notes.length] / 2, 0.15, "triangle");
                        step++;
                    }
                }, 250);
            }

            function stopBackgroundMusic() {
                if (musicInterval) clearInterval(musicInterval);
            }

            // Shop Database
            const shopItems = {
                cyber: { type: "skin", name: "Cyber", color: "#00f2fe", glow: "#ff007f", cost: 0, unlocked: true },
                fire: { type: "skin", name: "Fire", color: "#ff3300", glow: "#ffcc00", cost: 50, unlocked: false },
                gold: { type: "skin", name: "Gold", color: "#ffe600", glow: "#ffffff", cost: 100, unlocked: false },
                neon_overlord: { 
                    type: "bundle", 
                    name: "⚡ NEON BUNDLE", 
                    color: "#ff007f", 
                    glow: "#00f2fe", 
                    cost: 200, 
                    unlocked: false, 
                    desc: "Neon Paddle + Cyan Trail" 
                },
                dragon_lord: { 
                    type: "bundle", 
                    name: "🔥 DRAGON BUNDLE", 
                    color: "#ff5500", 
                    glow: "#ffe600", 
                    cost: 350, 
                    unlocked: false, 
                    desc: "Inferno Paddle + Fire Particles" 
                },
                void_walker: { 
                    type: "bundle", 
                    name: "🌌 VOID BUNDLE", 
                    color: "#a855f7", 
                    glow: "#ec4899", 
                    cost: 500, 
                    unlocked: false, 
                    desc: "Quantum Paddle + Void Trail" 
                }
            };
            let equippedSkin = "cyber";

            function updateCurrencyDisplays() {
                menuCoins.textContent = coins;
                shopCoins.textContent = coins;
                coinsUI.textContent = coins;
            }

            function renderShop() {
                shopGrid.innerHTML = "";
                Object.keys(shopItems).forEach(key => {
                    const item = shopItems[key];
                    const card = document.createElement("div");
                    card.className = `skin-card ${equippedSkin === key ? 'equipped' : ''}`;
                    
                    let statusText = "";
                    if (equippedSkin === key) statusText = "EQUIPPED";
                    else if (item.unlocked) statusText = "OWNED";
                    else statusText = `💎 ${item.cost}`;

                    card.innerHTML = `
                        <div class="skin-name" style="color:${item.color};">${item.name}</div>
                        ${item.type === 'bundle' ? `<div style="font-size:7px; color:#a0a0c0; margin-top:1px;">${item.desc}</div>` : ''}
                        <div class="skin-status">${statusText}</div>
                    `;

                    card.addEventListener("click", () => {
                        if (item.unlocked) {
                            equippedSkin = key;
                            renderShop();
                        } else if (coins >= item.cost) {
                            coins -= item.cost;
                            item.unlocked = true;
                            equippedSkin = key;
                            updateCurrencyDisplays();
                            renderShop();
                            playSynthSound(800, 0.2, "square");
                        }
                    });

                    shopGrid.appendChild(card);
                });
            }

            const p1Paddle = { x: 190, y: 540, w: 100, h: 14, color: '#00f2fe' };
            const p2Paddle = { x: 190, y: 20, w: 100, h: 14, color: '#ff007f' };
            let boss = { x: 190, y: 40, w: 120, h: 20, hp: 100, maxHp: 100, vx: 3 };

            let balls = [];
            let bricks = [];
            let particles = [];
            let trail = [];

            const keys = {};
            window.addEventListener("keydown", (e) => {
                keys[e.key] = true;
                if ((e.key === "p" || e.key === "P" || e.key === "Escape") && gameRunning) togglePause();
            });
            window.addEventListener("keyup", (e) => keys[e.key] = false);

            canvas.addEventListener("mousemove", (e) => {
                if (!gameRunning || isPaused || currentMode === "LOCAL 2P") return;
                const rect = canvas.getBoundingClientRect();
                const mouseX = (e.clientX - rect.left) - p1Paddle.w / 2;
                
                if (currentMode === "PVP" && !isHost) {
                    p2Paddle.x = mouseX;
                    clampPaddle(p2Paddle);
                } else {
                    p1Paddle.x = mouseX;
                    clampPaddle(p1Paddle);
                }
            });

            function clampPaddle(p) {
                if (p.x < 0) p.x = 0;
                if (p.x + p.w > canvas.width) p.x = canvas.width - p.w;
            }

            function togglePause() {
                isPaused = !isPaused;
                if (isPaused) pauseScreen.classList.remove("hidden");
                else { pauseScreen.classList.add("hidden"); lastTime = performance.now(); }
            }

            function createParticles(x, y, color, count = 10) {
                for (let i = 0; i < count; i++) {
                    particles.push({
                        x, y,
                        vx: (Math.random() - 0.5) * 6,
                        vy: (Math.random() - 0.5) * 6,
                        size: Math.random() * 4 + 2,
                        color,
                        life: 1.0
                    });
                }
            }

            // PVP & Peer Networking
            function createLobby() {
                initAudio();
                const customName = document.getElementById("create-lobby-name").value || "NEON MATCH";
                const roomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
                
                peer = new Peer(roomCode);
                lobbyStatus.textContent = "CREATING LOBBY...";

                peer.on('open', (id) => {
                    lobbyStatus.textContent = `LOBBY '${customName.toUpperCase()}' OPEN (ID: ${id})`;
                    isHost = true;
                    addLobbyToUI(customName, id);
                });

                peer.on('connection', (connection) => {
                    conn = connection;
                    setupDataListeners();
                    lobbyStatus.textContent = "PLAYER 2 JOINED LOBBY!";
                    setTimeout(() => { pvpScreen.classList.add("hidden"); triggerLoadingSequence("PVP"); }, 800);
                });
            }

            function addLobbyToUI(name, code) {
                lobbyListContainer.innerHTML = "";
                const item = document.createElement("div");
                item.className = "lobby-item";
                item.innerHTML = `<span><strong>${name}</strong> [${code}]</span> <button onclick="joinLobbyByID('${code}')">JOIN</button>`;
                lobbyListContainer.appendChild(item);
            }

            window.joinLobbyByID = function(code) {
                initAudio();
                peer = new Peer();
                lobbyStatus.textContent = `JOINING LOBBY ${code}...`;
                peer.on('open', () => {
                    conn = peer.connect(code.toUpperCase());
                    isHost = false;
                    setupDataListeners();
                    conn.on('open', () => {
                        lobbyStatus.textContent = "CONNECTED TO LOBBY!";
                        setTimeout(() => { pvpScreen.classList.add("hidden"); triggerLoadingSequence("PVP"); }, 800);
                    });
                });
            };

            function setupDataListeners() {
                conn.on('data', (data) => {
                    if (isHost) {
                        if (data.p2X !== undefined) p2Paddle.x = data.p2X;
                    } else {
                        if (data.p1X !== undefined) p1Paddle.x = data.p1X;
                        if (data.ball) {
                            balls[0].x = data.ball.x;
                            balls[0].y = data.ball.y;
                        }
                        if (data.score !== undefined) {
                            score = data.score;
                            scoreUI.textContent = score;
                        }
                    }
                });
            }

            function syncOnlineData() {
                if (!conn || !conn.open) return;
                if (isHost) {
                    conn.send({
                        p1X: p1Paddle.x,
                        ball: balls[0] ? { x: balls[0].x, y: balls[0].y } : null,
                        score: score
                    });
                } else {
                    conn.send({ p2X: p2Paddle.x });
                }
            }

            // Navigation Handlers
            document.getElementById("btn-sp-start").addEventListener("click", () => triggerLoadingSequence("CLASSIC"));
            document.getElementById("btn-survival-start").addEventListener("click", () => triggerLoadingSequence("SURVIVAL"));
            document.getElementById("btn-speed-start").addEventListener("click", () => triggerLoadingSequence("SPEED DEMON"));
            document.getElementById("btn-boss-start").addEventListener("click", () => triggerLoadingSequence("BOSS BATTLE"));

            // Dynamic setup for Local 2P button if present in HTML, else fallback
            const btnLocal2P = document.getElementById("btn-local2p-start");
            if (btnLocal2P) {
                btnLocal2P.addEventListener("click", () => triggerLoadingSequence("LOCAL 2P"));
            }

            document.getElementById("btn-shop-menu").addEventListener("click", () => {
                renderShop(); updateCurrencyDisplays();
                titleScreen.classList.add("hidden"); shopScreen.classList.remove("hidden");
            });
            document.getElementById("btn-back-shop").addEventListener("click", () => {
                shopScreen.classList.add("hidden"); titleScreen.classList.remove("hidden");
            });

            document.getElementById("btn-pvp-menu").addEventListener("click", () => {
                titleScreen.classList.add("hidden"); pvpScreen.classList.remove("hidden");
            });
            document.getElementById("btn-back-pvp").addEventListener("click", () => {
                pvpScreen.classList.add("hidden"); titleScreen.classList.remove("hidden");
            });

            document.getElementById("btn-settings-menu").addEventListener("click", () => {
                titleScreen.classList.add("hidden"); settingsScreen.classList.remove("hidden");
            });
            document.getElementById("btn-back-settings").addEventListener("click", () => {
                settings.sfx = document.getElementById("setting-sfx").checked;
                settings.music = document.getElementById("setting-music").checked;
                settings.shake = document.getElementById("setting-shake").checked;
                settingsScreen.classList.add("hidden"); titleScreen.classList.remove("hidden");
            });

            document.getElementById("btn-create-lobby").addEventListener("click", createLobby);
            document.getElementById("btn-join-direct").addEventListener("click", () => {
                const code = document.getElementById("direct-code-input").value;
                if (code) joinLobbyByID(code);
            });

            document.getElementById("btn-resume").addEventListener("click", () => { if (isPaused) togglePause(); });
            document.getElementById("btn-pause-quit").addEventListener("click", quitToMenu);
            document.getElementById("btn-quit-menu").addEventListener("click", quitToMenu);

            function triggerLoadingSequence(mode) {
                initAudio();
                titleScreen.classList.add("hidden");
                loadingScreen.classList.remove("hidden");

                let progress = 0;
                loadingBar.style.width = "0%";
                loadingText.textContent = `PREPARING ${mode}...`;

                const interval = setInterval(() => {
                    progress += 20;
                    loadingBar.style.width = `${progress}%`;

                    if (progress >= 100) {
                        clearInterval(interval);
                        loadingScreen.classList.add("hidden");
                        startGame(mode);
                    }
                }, 150);
            }

            function createBall(vy = -4, speedMultiplier = 1) {
                return { 
                    x: canvas.width / 2, 
                    y: canvas.height / 2, 
                    radius: 8, 
                    vx: (Math.random() > 0.5 ? 4 : -4) * speedMultiplier, 
                    vy: vy * speedMultiplier, 
                    color: '#ffe600' 
                };
            }

            function initBricks() {
                bricks = [];
                const rows = 4, cols = 6, width = 68, height = 18, padding = 8, offsetLeft = 15, offsetTop = 60;
                const colors = ["#ff007f", "#7928ca", "#00f2fe", "#ffe600"];

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        bricks.push({ x: c * (width + padding) + offsetLeft, y: r * (height + padding) + offsetTop, w: width, h: height, color: colors[r % colors.length], active: true });
                    }
                }
            }

            function startGame(mode) {
                gameRunning = true; isPaused = false; currentMode = mode;
                score = 0; survivalTimer = 0; screenShake = 0;
                playerHp = maxHp;
                particles = []; trail = [];
                
                updateCurrencyDisplays();
                scoreUI.textContent = "0"; modeUI.textContent = mode;
                
                p1Paddle.color = shopItems[equippedSkin].color;

                if (mode === "SPEED DEMON") balls = [createBall(-7, 1.8)];
                else balls = [createBall()];

                if (mode === "CLASSIC" || mode === "SPEED DEMON") initBricks();
                else bricks = [];

                if (mode === "BOSS BATTLE") { boss.hp = 100; boss.x = 180; }

                titleScreen.classList.add("hidden"); gameOverScreen.classList.add("hidden"); ui.classList.remove("hidden");
                startBackgroundMusic();
                lastTime = performance.now(); requestAnimationFrame(gameLoop);
            }

            function quitToMenu() {
                gameRunning = false; isPaused = false;
                stopBackgroundMusic();
                updateCurrencyDisplays();
                pauseScreen.classList.add("hidden"); gameOverScreen.classList.add("hidden"); ui.classList.add("hidden");
                titleScreen.classList.remove("hidden");
                if (peer) peer.destroy();
            }

            function update(dt) {
                if (!gameRunning || isPaused) return;
                const ts = dt / 16.66;

                if (screenShake > 0) screenShake -= dt * 0.02;

                if (currentMode === "SURVIVAL") {
                    survivalTimer += dt;
                    if (survivalTimer > 7000) {
                        survivalTimer = 0;
                        balls.push(createBall(Math.random() > 0.5 ? 4 : -4));
                        if (settings.shake) screenShake = 5;
                        playSynthSound(600, 0.2, "sawtooth");
                    }
                }

                if (currentMode === "BOSS BATTLE") {
                    boss.x += boss.vx * ts;
                    if (boss.x <= 0 || boss.x + boss.w >= canvas.width) boss.vx *= -1;
                }

                // --- CONTROLS IMPLEMENTATION ---
                if (currentMode === "LOCAL 2P") {
                    // Player 1 (Bottom): Arrow Keys
                    if (keys["ArrowLeft"]) p1Paddle.x -= 6 * ts;
                    if (keys["ArrowRight"]) p1Paddle.x += 6 * ts;

                    // Player 2 (Top): WASD Keys
                    if (keys["a"] || keys["A"]) p2Paddle.x -= 6 * ts;
                    if (keys["d"] || keys["D"]) p2Paddle.x += 6 * ts;

                    clampPaddle(p1Paddle);
                    clampPaddle(p2Paddle);
                } else if (currentMode !== "PVP" || isHost) {
                    if (keys["ArrowLeft"]) p1Paddle.x -= 6 * ts;
                    if (keys["ArrowRight"]) p1Paddle.x += 6 * ts;
                    clampPaddle(p1Paddle);
                }

                if (currentMode !== "PVP" && currentMode !== "BOSS BATTLE" && currentMode !== "LOCAL 2P") {
                    p2Paddle.x += (balls[0].x - (p2Paddle.x + p2Paddle.w / 2)) * 0.08 * ts;
                    clampPaddle(p2Paddle);
                } else if (currentMode === "PVP" && !isHost) {
                    if (keys["ArrowLeft"]) p2Paddle.x -= 6 * ts;
                    if (keys["ArrowRight"]) p2Paddle.x += 6 * ts;
                    clampPaddle(p2Paddle);
                }

                if (currentMode !== "PVP" || isHost) {
                    balls.forEach(b => {
                        b.x += b.vx * ts; b.y += b.vy * ts;
                        trail.push({ x: b.x, y: b.y, life: 1.0 });

                        // Wall collisions
                        if (b.x - b.radius <= 0) {
                            b.x = b.radius;
                            b.vx *= -1;
                            playSynthSound(300, 0.05);
                        } else if (b.x + b.radius >= canvas.width) {
                            b.x = canvas.width - b.radius;
                            b.vx *= -1;
                            playSynthSound(300, 0.05);
                        }

                        // Top boundary collision (Non-PVP & Non-Local2P modes)
                        if (currentMode !== "PVP" && currentMode !== "LOCAL 2P" && b.y - b.radius <= 0) {
                            b.y = b.radius;
                            b.vy *= -1;
                            playSynthSound(350, 0.05);
                        } else if (currentMode === "LOCAL 2P" && b.y - b.radius <= 0) {
                            // Point scored by P1 in Local 2P mode
                            b.out = true;
                            score += 50;
                            scoreUI.textContent = score;
                            playSynthSound(600, 0.2, "sine");
                            setTimeout(() => { if (gameRunning && balls.length === 0) balls.push(createBall(4)); }, 500);
                        }

                        // Bottom boundary
                        if (b.y + b.radius >= canvas.height) {
                            b.out = true;
                            playerHp--;
                            if (settings.shake) screenShake = 12;
                            playSynthSound(120, 0.3, "sawtooth");

                            if (playerHp > 0) {
                                setTimeout(() => {
                                    if (gameRunning && balls.length === 0) balls.push(createBall());
                                }, 500);
                            }
                        }

                        // Paddle 1 Collision
                        if (b.y + b.radius >= p1Paddle.y && b.y - b.radius <= p1Paddle.y + p1Paddle.h &&
                            b.x >= p1Paddle.x && b.x <= p1Paddle.x + p1Paddle.w && b.vy > 0) {
                            b.vy *= -1.05;
                            let hitPoint = (b.x - (p1Paddle.x + p1Paddle.w / 2)) / (p1Paddle.w / 2);
                            b.vx = hitPoint * 7;
                            createParticles(b.x, b.y, p1Paddle.color, 12);
                            playSynthSound(440, 0.1, "square");
                            score += 10;
                            coins += 1;
                            updateCurrencyDisplays();
                            scoreUI.textContent = score;
                        }

                        // Paddle 2 Collision
                        if (b.y - b.radius <= p2Paddle.y + p2Paddle.h && b.y + b.radius >= p2Paddle.y &&
                            b.x >= p2Paddle.x && b.x <= p2Paddle.x + p2Paddle.w && b.vy < 0) {
                            b.vy *= -1.05;
                            let hitPoint = (b.x - (p2Paddle.x + p2Paddle.w / 2)) / (p2Paddle.w / 2);
                            b.vx = hitPoint * 7;
                            createParticles(b.x, b.y, p2Paddle.color, 12);
                            playSynthSound(400, 0.1, "square");
                        }

                        // Boss Collision
                        if (currentMode === "BOSS BATTLE") {
                            if (b.y - b.radius <= boss.y + boss.h && b.y + b.radius >= boss.y &&
                                b.x >= boss.x && b.x <= boss.x + boss.w && b.vy < 0) {
                                b.vy *= -1;
                                boss.hp -= 5;
                                score += 50;
                                coins += 5;
                                updateCurrencyDisplays();
                                createParticles(b.x, b.y, "#ff007f", 20);
                                playSynthSound(150, 0.2, "sawtooth");
                                if (settings.shake) screenShake = 8;
                                if (boss.hp <= 0) gameOver(true, "BOSS DESTROYED!");
                            }
                        }

                        // Brick Collisions
                        if (currentMode === "CLASSIC" || currentMode === "SPEED DEMON") {
                            bricks.forEach(brick => {
                                if (brick.active) {
                                    if (b.x + b.radius > brick.x && b.x - b.radius < brick.x + brick.w &&
                                        b.y + b.radius > brick.y && b.y - b.radius < brick.y + brick.h) {
                                        brick.active = false;
                                        b.vy *= -1;
                                        score += 20;
                                        coins += 2;
                                        updateCurrencyDisplays();
                                        scoreUI.textContent = score;
                                        createParticles(b.x, b.y, brick.color, 15);
                                        playSynthSound(520, 0.08, "triangle");

                                        if (bricks.every(br => !br.active)) {
                                            initBricks();
                                        }
                                    }
                                }
                            });
                        }
                    });

                    balls = balls.filter(b => !b.out);

                    if (playerHp <= 0) {
                        gameOver(false, "GAME OVER - OUT OF HEALTH");
                    }
                }

                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.03;
                });
                particles = particles.filter(p => p.life > 0);

                trail.forEach(t => t.life -= 0.05);
                trail = trail.filter(t => t.life > 0);

                if (currentMode === "PVP") syncOnlineData();
            }

            function gameOver(won, message) {
                gameRunning = false;
                stopBackgroundMusic();
                document.getElementById("over-title").textContent = won ? "VICTORY!" : "GAME OVER";
                document.getElementById("winner-text").textContent = message;
                gameOverScreen.classList.remove("hidden");
                ui.classList.add("hidden");
            }

            function render() {
                ctx.save();
                
                if (screenShake > 0) {
                    ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Draw Trails
                trail.forEach(t => {
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, 6 * t.life, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 242, 254, ${t.life * 0.4})`;
                    ctx.fill();
                });

                // Draw Bricks
                bricks.forEach(b => {
                    if (b.active) {
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = b.color;
                        ctx.fillStyle = b.color;
                        ctx.fillRect(b.x, b.y, b.w, b.h);
                        ctx.shadowBlur = 0;
                    }
                });

                // Draw Boss
                if (currentMode === "BOSS BATTLE") {
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = "#ff007f";
                    ctx.fillStyle = "#ff007f";
                    ctx.fillRect(boss.x, boss.y, boss.w, boss.h);

                    ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
                    ctx.fillRect(100, 10, 280, 8);
                    ctx.fillStyle = "#00f2fe";
                    ctx.fillRect(100, 10, (boss.hp / boss.maxHp) * 280, 8);
                    ctx.shadowBlur = 0;
                }

                // Draw P1 Paddle
                ctx.shadowBlur = 15;
                ctx.shadowColor = p1Paddle.color;
                ctx.fillStyle = p1Paddle.color;
                ctx.fillRect(p1Paddle.x, p1Paddle.y, p1Paddle.w, p1Paddle.h);

                // Draw P2 Paddle (Shown in PVP, Survival, or Local 2P)
                if (currentMode === "PVP" || currentMode === "SURVIVAL" || currentMode === "LOCAL 2P") {
                    ctx.shadowColor = p2Paddle.color;
                    ctx.fillStyle = p2Paddle.color;
                    ctx.fillRect(p2Paddle.x, p2Paddle.y, p2Paddle.w, p2Paddle.h);
                }

                // Draw Balls
                balls.forEach(b => {
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                    ctx.shadowColor = b.color;
                    ctx.fillStyle = b.color;
                    ctx.fill();
                });

                // Draw Player Health Bar HUD
                for (let i = 0; i < maxHp; i++) {
                    ctx.beginPath();
                    ctx.arc(20 + (i * 22), 560, 7, 0, Math.PI * 2);
                    if (i < playerHp) {
                        ctx.fillStyle = "#ff007f";
                        ctx.shadowColor = "#ff007f";
                        ctx.shadowBlur = 10;
                    } else {
                        ctx.fillStyle = "#221545";
                        ctx.shadowBlur = 0;
                    }
                    ctx.fill();
                }

                // Draw Particles
                particles.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                });

                ctx.shadowBlur = 0;
                ctx.restore();
            }

            function gameLoop(now) {
                if (!lastTime) lastTime = now;
                const dt = now - lastTime;
                lastTime = now;

                update(dt);
                render();

                if (gameRunning) requestAnimationFrame(gameLoop);
            }
        });
    </script>
</body>
</html>
